<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>行程与地图</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#12161c;--card:#1b212b;--line:#2a323e;--text:#e8ecf1;--dim:#9aa5b1;--accent:#6ea8fe}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{padding:16px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{margin:6px 0;font-size:22px}
h2{font-size:15px;margin:26px 0 10px;color:var(--accent)}
.sub{color:var(--dim);font-size:13px}.sub b{color:var(--text)}
.badge{display:inline-block;background:#222b36;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:3px 11px;font-size:11px}
.badge b{color:var(--accent)}
a.back{color:var(--dim);font-size:12px;text-decoration:none}
#map{height:56vh;min-height:300px;border-radius:12px;border:1px solid var(--line);background:#0e1218;z-index:1}
#map:fullscreen{height:100vh!important;width:100vw!important;border-radius:0;border:0;position:fixed;inset:0;z-index:9999}
#map:-webkit-full-screen{height:100vh!important;width:100vw!important;border-radius:0;position:fixed;inset:0;z-index:9999}
.fsbtn a{display:flex!important;align-items:center;justify-content:center;width:32px!important;height:32px!important;line-height:32px!important;font-size:15px;color:#222;text-decoration:none;background:#fff;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.day .hd{display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:#202832;border-bottom:1px solid var(--line)}
.day .d{font-size:17px;font-weight:700;color:var(--accent)}
.day .w{color:var(--dim);font-size:12px}
.day .s{margin-left:auto;color:var(--dim);font-size:12px}
.day .bd{padding:12px 16px}
.tp{color:var(--dim);font-size:12px;margin-bottom:8px}.tp b{color:var(--text);font-weight:500}
.note{color:#e8c07a;font-size:12px;margin-top:8px}
.ampm{color:#9aa5b1;font-size:12px}
.day .bd ul li{margin:7px 0}
.pn{font-size:13px}
.dur{display:inline-block;margin-left:6px;background:rgba(110,168,254,.13);color:#6ea8fe;
 border:1px solid rgba(110,168,254,.28);border-radius:6px;padding:0 6px;font-size:11px}
.pd{color:#9aa5b1;font-size:11.5px;line-height:1.55;margin:3px 0 0}
.bk{color:#c9a86a;font-size:11.5px;line-height:1.55;margin:3px 0 0;background:rgba(201,168,106,.08);
 border-left:2px solid rgba(201,168,106,.5);padding:3px 7px;border-radius:0 5px 5px 0}
.hsec{margin-bottom:24px}
.hsec h3{font-size:14px;margin:0 0 10px;color:var(--text)}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.hcard .hn{font-weight:600;font-size:15px}
.hcard .hstars{color:#e8c07a;font-size:12px;margin-left:6px}
.hcard .hm{color:var(--dim);font-size:12px;margin-top:4px}
.hcard .ha{margin-top:8px}
.hcard .ha a{color:var(--accent);text-decoration:none;font-size:12px;margin-right:16px}
.more{color:var(--accent);font-size:12px;cursor:pointer;background:none;border:none;padding:0}
.morelist{display:none;margin-top:10px;font-size:12px;color:var(--dim);line-height:2}
.morelist.on{display:block}
ul{margin:0;padding-left:18px}li{margin:3px 0;font-size:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.thumbs img{height:96px;width:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
.pros{color:#7fd39a}.cons{color:#e08a8a}
.ovw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:12px}
.ovw .row{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.ovw .row:last-child{border-bottom:0}
.ovw .dt{flex:0 0 auto;min-width:74px;font-weight:700;color:var(--accent);font-size:14px}
.ovw .dt .w{color:var(--dim);font-weight:400;font-size:11px;margin-left:3px}
.ovw .city{flex:0 0 auto;min-width:96px;font-size:13px;color:var(--text)}
.ovw .city.in::before{content:"→ ";color:var(--dim)}.ovw .city.out::after{content:" →";color:var(--dim)}
.ovw .city .rt{color:var(--dim);font-weight:400}
.ovw .seg{flex:0 0 auto;font-size:12px}
.ovw .seg .ico{margin-right:3px}
.ovw .seg.flt{color:#f0b25a}.ovw .seg.trn{color:#7fb3ff}
.ovw .seg .tn{color:var(--text);font-weight:500}
.ovw .seg .tm{color:var(--dim);margin-left:4px}
.ovw .seg .tm.pending{color:#8a94a1;font-style:italic}
.ovw .sights{flex:1 1 auto;min-width:0;color:var(--dim);font-size:12px;line-height:1.55;text-align:right}
@media(max-width:640px){
.ovw .row{flex-wrap:wrap;gap:4px 10px;padding:10px 14px}
.ovw .sights{text-align:left;width:100%;padding-top:2px;border-top:1px dashed var(--line);margin-top:2px;padding-left:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:600}.stat .l{color:var(--dim);font-size:12px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:24px 0 40px}
.plabel{background:rgba(20,25,33,.92);border:1px solid #39434f;color:#e8ecf1;border-radius:6px;padding:3px 7px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.plabel::before{display:none!important}
.plabel .lb{color:#6ea8fe;font-size:10px;margin-top:2px}
.plabel .nt{color:#9aa5b1;font-size:10px}
.clabel{background:rgba(15,19,25,.9);border:1px solid #46525f;color:#fff;border-radius:9px;padding:5px 12px;font-size:15px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.clabel::before{display:none!important}
.leaflet-popup-content-wrapper{background:#1b212b;color:#e8ecf1;border-radius:10px}
.leaflet-popup-tip{background:#1b212b}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-popup-content .note{color:#9aa5b1;font-size:12px;margin-top:4px}
.tcard{border-color:#6b7a8c}
.tcard.sm{font-size:10.5px;padding:2px 6px}
.arlab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(18,22,28,.9);
 border:1px solid #5a6673;color:#e8ecf1;border-radius:8px;padding:2px 7px;font-size:11px;line-height:1.45;
 box-shadow:0 1px 5px rgba(0,0,0,.45)}
.lgd{background:rgba(15,19,25,.92);color:#e8ecf1;border:1px solid #46525f;border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.7;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.lgd i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px #fff}
</style></head><body><div class="wrap">
<header>
<a class="back" href="../index.html" id="backlink" style="display:none">← 返回</a>
<h1 id="h1">行程与地图</h1>
<div class="sub" id="subtitle"></div>
<div class="sub" id="routeline"></div>
<div class="sub" style="margin-top:9px"><span class="badge" id="ver"></span></div>
</header>
<div id="tradeoffSec" style="display:none"><h2>取舍</h2><div class="card" id="tradeoff"></div></div>
<h2>住宿分配</h2><div class="grid" id="stats"></div>
<h2>地图（右上角 ⛶ 可全屏）</h2><div id="map"></div>
<h2>行程一览</h2><div class="ovw" id="overview"></div>
<h2>逐日行程</h2><div id="days"></div>
<div id="hotelsSec" style="display:none"><h2>住宿候选（点图层控件可勾选「推荐酒店」）</h2><div id="hotels"></div></div>
<footer><div id="verfoot"></div><div style="margin-top:6px">地图数据 © OpenStreetMap contributors</div></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/places.js"></script>
<script src="data/itinerary.js"></script>
<script src="data/transit.js"></script>
<script src="data/hotels.js"></script>
<script src="data/track.js"></script>
<script src="data/access.js"></script>
<script src="data/rides.js"></script>
<script src="data/version.js"></script>
<script>
/* ============================================================
   通用行程地图模板 —— 只读 window.PLACES / window.ITIN /
   window.TRANSIT / window.HOTELS / window.VERSION 这几个全局数据，
   不需要修改本文件里的任何一行；换行程只需要换 data/*.js。
   数据格式见 ../reference/data-schema.md
   ============================================================ */
const ITIN = window.ITIN || {days:[], cities:[]};
const PALETTE = ["#e0605e","#6ea8fe","#e8a33d","#b08ee8","#5fbf8f","#e07bb0","#7d9ee8","#c9a24a","#4fb0c6","#c77dd1"];
const DAYCOL = ["#d81e5b","#e8590c","#1c7ed6","#7048e8","#2f9e44","#12b886","#0ca678","#1098ad","#4263eb","#ae3ec9","#f2a20c","#7cb518"];
const CITY_ZOOM = ITIN.cityZoom || 11;

// ---------- 由 ITIN.cities 生成城市→中文名 / 颜色 映射（不再手写硬编码） ----------
const CITY_CN = {}, COLORS = {};
(ITIN.cities||[]).forEach(function(c,i){
  CITY_CN[c.key] = c.name || c.key;
  COLORS[c.key] = c.color || PALETTE[i % PALETTE.length];
});

// ---------- 头部：标题 / 副标题 / 路线 / 取舍 / 住宿统计（全部来自 ITIN） ----------
document.title = (ITIN.title || "行程与地图");
document.getElementById("h1").textContent = ITIN.title || "行程与地图";
document.getElementById("subtitle").textContent = ITIN.subtitle || "";
document.getElementById("routeline").textContent = ITIN.route || "";
if (ITIN.backHref) {
  const bl = document.getElementById("backlink");
  bl.href = ITIN.backHref; bl.textContent = ITIN.backLabel || "← 返回"; bl.style.display = "";
}
if ((ITIN.pros&&ITIN.pros.length) || (ITIN.cons&&ITIN.cons.length)) {
  document.getElementById("tradeoffSec").style.display = "";
  document.getElementById("tradeoff").innerHTML =
    (ITIN.pros||[]).map(function(t){return '<div class="pros">+ '+t+"</div>";}).join("") +
    (ITIN.cons||[]).map(function(t){return '<div class="cons">− '+t+"</div>";}).join("");
}
document.getElementById("stats").innerHTML = (ITIN.stay||[]).map(function(s){
  return '<div class="stat"><div class="n">'+s[1]+'</div><div class="l">'+s[0]+"</div></div>";
}).join("");

// ---------- 地图底图 ----------
const map = L.map("map").setView(ITIN.mapCenter || [35,105], ITIN.mapZoom || 5);
const BASEMAPS={
  "街道":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}),
  "地形":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}),
  "卫星":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"})
};
BASEMAPS["地形"].addTo(map);
const TRAILS=L.tileLayer("https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png",{maxZoom:17,attribution:"Routes &copy; waymarkedtrails.org"});

const DAYS=ITIN.days||[];
const UD=DAYS.map(function(d){return d.date;}).filter(function(v,i,a){return a.indexOf(v)===i;});
function dayColor(dt){const i=UD.indexOf(dt);return DAYCOL[(i<0?0:i)%DAYCOL.length];}
function kmOf(a,b){const P=Math.PI/180;
  return Math.acos(Math.min(1,Math.sin(a[0]*P)*Math.sin(b[0]*P)+
    Math.cos(a[0]*P)*Math.cos(b[0]*P)*Math.cos((b[1]-a[1])*P)))*6371;}
function bearingOf(a,b){const P=Math.PI/180,l1=a[0]*P,l2=b[0]*P,dl=(b[1]-a[1])*P;
  const y=Math.sin(dl)*Math.cos(l2),x=Math.cos(l1)*Math.sin(l2)-Math.sin(l1)*Math.cos(l2)*Math.cos(dl);
  return (Math.atan2(y,x)/P+360)%360;}
function rotOf(a,b){return bearingOf(a,b)+90;}
function svgMark(a,b,d,fill,color,sw,size){
  size=size||18;
  const h=size/2;
  return L.divIcon({className:"",iconSize:[size,size],iconAnchor:[h,h],
    html:'<svg width="'+size+'" height="'+size+'" viewBox="0 0 18 18" style="transform:rotate('+rotOf(a,b)+'deg);display:block">'+
      '<path d="'+d+'" fill="'+fill+'" stroke="'+color+'" stroke-width="'+sw+'" '+
      'stroke-linecap="round" stroke-linejoin="round"/></svg>'});
}
const TRI="M3,9 L13.5,3 L13.5,15 Z";
const BI="M1.5,9 L7.5,4 L7.5,7 L10.5,7 L10.5,4 L16.5,9 L10.5,14 L10.5,11 L7.5,11 L7.5,14 Z";
function isLoop(coords){
  if(!coords||coords.length<8) return false;
  if(kmOf(coords[0],coords[coords.length-1])>0.04) return false;
  const mid=Math.floor(coords.length/2);
  let ok=0,n=0,step=Math.max(1,Math.floor(mid/6));
  for(let i=0;i<mid;i+=step){
    n++;
    if(kmOf(coords[i],coords[coords.length-1-i])<0.06) ok++;
  }
  return n>0&&ok/n>=0.6;
}
function nearestTrack(pt){
  const T=window.TRACK||{};
  let best=null, bd=Infinity, day=null;
  (T.sections||[]).forEach(function(s){
    (s.parts||[]).forEach(function(coords){
      (coords||[]).forEach(function(c){
        const d=kmOf(pt,c);
        if(d<bd){ bd=d; best=c; day=s.day||null; }
      });
    });
  });
  return best ? {at:best, km:bd, day:day} : {at:pt, km:Infinity, day:null};
}
const PSEC={}, SECDAY={};
(window.PLACES||[]).forEach(function(p){ if(p.sec!=null&&p.name) PSEC[p.name]=p.sec; });
(ITIN.days||[]).forEach(function(d,di){
  (d.items||[]).forEach(function(nm){
    const s=PSEC[nm];
    if(s!=null&&SECDAY[s]==null) SECDAY[s]=di;
  });
});
function trackColor(s){
  if(s.day) return dayColor(s.day);
  const di=SECDAY[s.n];
  return di==null ? "#ff8c42" : DAYCOL[di%DAYCOL.length];
}
const trackLayer=L.layerGroup();
const arrowM=[];
(function(){
  const T=window.TRACK||{};
  (T.sections||[]).forEach(function(s){
    const col=trackColor(s);
    (s.parts||[]).forEach(function(coords){
      if(!coords||coords.length<2) return;
      L.polyline(coords,{color:"#ffffff",weight:7,opacity:.72,interactive:false}).addTo(trackLayer);
      L.polyline(coords,{color:col,weight:4,opacity:.95})
        .bindTooltip(s.name||("第"+s.n+"段"),{sticky:true}).addTo(trackLayer);
      if(isLoop(coords)){
        const mid=Math.floor(coords.length/2);
        const i=Math.max(1,Math.floor(mid*0.55));
        const a=coords[i-1], b=coords[Math.min(i+1,mid)];
        arrowM.push(L.marker(coords[i],{icon:svgMark(a,b,BI,col,"#ffffff",1.6,28),
          interactive:false,keyboard:false}).addTo(trackLayer));
      }else{
        let acc=0;
        for(let i=1;i<coords.length;i++){
          acc+=kmOf(coords[i-1],coords[i]);
          if(acc<1.2) continue;
          acc=0;
          const a=coords[i-1], b=coords[Math.min(i+1,coords.length-1)];
          arrowM.push(L.marker(coords[i],{icon:svgMark(a,b,TRI,col,"#ffffff",1.2),
            interactive:false,keyboard:false}).addTo(trackLayer));
        }
      }
    });
  });
})();
trackLayer.addTo(map);

// ---------- 景点标注 = 该地点在行程里出现的日期（运行时算，不需要单独的 labels 文件） ----------
const LAB = {};
(ITIN.days||[]).forEach(function(d){
  const items=d.items||[], n=items.length;
  items.forEach(function(nm,i){
    const sess = n<=1 ? "" : (i < (n+1)/2 ? "上午" : "下午");
    (LAB[nm]=LAB[nm]||[]).push(d.date+(sess?" "+sess:""));
  });
});

// ---------- 景点标记 + 城市中心标签 ----------
const groups={}, bounds=[], placeM=[], placeLL=[], cityM=[], cityPos={}, hM=[], N2P={};
(window.PLACES||[]).forEach(function(p){ (groups[p.city]=groups[p.city]||[]).push(p); N2P[p.name]=p; });

Object.keys(groups).forEach(function(city){
  const items=groups[city], lg=L.layerGroup();
  items.forEach(function(p){
    const labArr=LAB[p.name]||[];
    const dt=labArr.length ? String(labArr[0]).split(" ")[0] : "";
    const col=dt ? dayColor(dt) : (COLORS[city]||"#888");
    const hit=nearestTrack([p.lat,p.lon]);
    const ll=hit.km<Infinity ? hit.at : [p.lat,p.lon];
    p._ll=ll;
    let near=0;
    placeLL.forEach(function(q){ if(kmOf(q,ll)<0.08) near++; });
    const dir=near%2 ? "bottom" : "top";
    const off=dir==="bottom" ? [0,8] : [0,-8];
    placeLL.push(ll);
    const html="<b>"+p.name+"</b>"
      +(labArr.length?'<div class="lb">'+labArr.join(" / ")+"</div>":"")
      +(p.note?'<div class="nt">'+p.note+"</div>":"");
    const m=L.circleMarker(ll,{radius:7,color:"#fff",weight:2,fillColor:col,fillOpacity:1})
      .bindPopup("<b>"+p.name+"</b>"+(labArr.length?'<div class="lb">'+labArr.join(" / ")+"</div>":"")
        +(p.note?'<div class="note">'+p.note+"</div>":""))
      .bindTooltip(html,{permanent:true,direction:dir,className:"plabel",opacity:1,offset:off})
      .addTo(lg);
    m.bringToFront();
    m._d = dt;
    placeM.push(m); bounds.push(ll);
  });
  lg.addTo(map);

  const lat=items.reduce((s,p)=>s+(p._ll?p._ll[0]:p.lat),0)/items.length;
  const lon=items.reduce((s,p)=>s+(p._ll?p._ll[1]:p.lon),0)/items.length;
  cityPos[city]=[lat,lon];
  L.marker([lat,lon],{icon:L.divIcon({className:"",html:"",iconSize:[0,0]}),interactive:false,keyboard:false})
    .bindTooltip(CITY_CN[city]||city,{permanent:true,direction:"center",className:"clabel",opacity:1})
    .addTo(map);
  cityM.push(cityPos[city]);
});
// 兜底：某城市在 ITIN.cities 里给了 lat/lon，但没有任何 PLACES 归属它
// （常见于纯始发/到达城市，如回程机场所在地）——否则该城市连不出箭头。
(window.ITIN.cities||[]).forEach(function(c){
  if(!cityPos[c.key] && typeof c.lat==="number" && typeof c.lon==="number"){
    cityPos[c.key]=[c.lat,c.lon];
  }
});
// cityM 上面临时存了坐标，下面重新收集真正的 marker 引用用于显隐控制
cityM.length=0;
map.eachLayer(function(l){ if(l.getTooltip && l.getTooltip() && l.getTooltip().options.className==="clabel") cityM.push(l); });

const TRIPCOL="#f5d76e", TRIPBG="#3a3114";
const termM=[];
let splitSeq=0;
if(!map.getPane("termPane")){
  map.createPane("termPane");
  map.getPane("termPane").style.zIndex="680";
  map.getPane("termPane").style.pointerEvents="none";
}
function termBox(html,w,h){
  return L.divIcon({className:"",iconSize:[w,h],iconAnchor:[w/2,h/2],html:html});
}
function termFace(ch,trip,segCol){
  if(trip){
    return '<div style="width:22px;height:22px;border-radius:3px;background:'+TRIPBG+';border:2px solid '+TRIPCOL+
      ';color:'+TRIPCOL+';font-size:12px;font-weight:700;line-height:22px;text-align:center;'+
      'box-shadow:0 0 0 2px rgba(0,0,0,.5)">'+ch+"</div>";
  }
  const bd=segCol||"#f2f5f8";
  return '<div style="width:20px;height:20px;border-radius:50%;background:#1b212b;border:2px solid '+bd+
    ';color:#fff;font-size:11px;font-weight:700;line-height:20px;text-align:center;'+
    'box-shadow:0 0 0 2px rgba(0,0,0,.5)">'+ch+"</div>";
}
function splitFace(ul,lr,ulFill,ulText,lrFill,lrText){
  const id="sp"+(splitSeq++);
  return '<svg width="52" height="44" viewBox="0 0 52 44" style="display:block;overflow:visible">'+
    '<defs><clipPath id="'+id+'"><rect x="1.5" y="1.5" width="49" height="41" rx="12"/></clipPath></defs>'+
    '<g clip-path="url(#'+id+')">'+

function iconFor(j,cityMode){
  const segs=j.segs||[];

    if(!j.trip) return null;

  }
  if(j.trip&&segs.length){
    return termBox(splitFace(j.trip,segs[0].ch,TRIPBG,TRIPCOL,segs[0].col,"#ffffff"),52,44);
  }
  if(segs.length>=2){
    return termBox(splitFace(segs[0].ch,segs[1].ch,segs[0].col,"#ffffff",segs[1].col,"#ffffff"),52,44);
  }
  if(segs.length===1) return termBox(termFace(segs[0].ch,false,segs[0].col),20,20);
  if(j.trip) return termBox(termFace(j.trip,true),22,22);

(function(){
  const joints=[];
  function absorb(pt,fn){
    let j=null;
    for(let i=0;i<joints.length;i++){
      if(kmOf(joints[i].at,pt)<0.08){ j=joints[i]; break; }
    }
    if(!j){ j={at:[pt[0],pt[1]], trip:null, segs:[]}; joints.push(j); }
    fn(j);
  }
  function endsOf(s){
    const parts=(s.parts||[]).filter(function(p){return p&&p.length;});
    if(!parts.length) return null;
    const last=parts[parts.length-1];
    return {start:parts[0][0], end:last[last.length-1]};
  }
  const byDay={};
  ((window.TRACK||{}).sections||[]).forEach(function(s){ if(s.day) byDay[s.day]=s; });
  DAYS.forEach(function(d){
    const e=byDay[d.date]?endsOf(byDay[d.date]):null;
    if(!e) return;
    const col=dayColor(d.date);
    absorb(e.start,function(j){ j.segs.push({ch:"起", col:col}); });
    absorb(e.end,function(j){ j.segs.push({ch:"终", col:col}); });
  });
  const first=(DAYS[0]||{}).items||[], last=(DAYS[DAYS.length-1]||{}).items||[];
  const sRef=(ITIN.start&&ITIN.start.place)||first[0]||null;
  const eRef=(ITIN.end&&ITIN.end.place)||last[last.length-1]||null;
  function atOf(name){
    const p=N2P[name];
    if(!p) return null;
    return p._ll||nearestTrack([p.lat,p.lon]).at;
  }
  const sAt=atOf(sRef), eAt=atOf(eRef);
  if(sAt) absorb(sAt,function(j){ j.trip="起"; });
  if(eAt) absorb(eAt,function(j){ j.trip="终"; });
  const cityMode=map.getZoom()<CITY_ZOOM;
  joints.forEach(function(j){
    const ic=iconFor(j,cityMode);
    const m=L.marker(j.at,{pane:"termPane",icon:ic||termBox("",1,1),interactive:false,keyboard:false,zIndexOffset:1100}).addTo(map);
    m._joint=j;
    if(!ic){ const e=m.getElement(); if(e) e.style.display="none"; }
    termM.push(m);
  });
  placeM.forEach(function(m){
    const ll=m.getLatLng();
    const hit=termM.some(function(t){ return kmOf([ll.lat,ll.lng], t._joint.at)<0.06; });
    if(!hit) return;
    const tip=m.getTooltip();
    if(!tip) return;
    const down=tip.options.direction==="bottom";
    tip.options.offset=L.point(down?[28,36]:[-28,-48]);
    m._nearTerm=true;
    if(tip.update) tip.update();
  });
})();

function arcPts(a,b,bendKm){
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const vy=b[0]-a[0], vx=b[1]-a[1];
  const n=Math.sqrt(vx*vx+vy*vy)||1;
  const s=bendKm/111;
  const c=[mid[0]+(-vx/n)*s, mid[1]+(vy/n)*s];
  const pts=[];
  for(let i=0;i<=16;i++){
    const t=i/16, u=1-t;
    pts.push([u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]);
  }
  return pts;
}

function nearestCity(ll){
  let best=null,bd=Infinity;
  Object.keys(cityPos).forEach(function(c){
    const p=cityPos[c], d=Math.pow(p[0]-ll.lat,2)+Math.pow(p[1]-ll.lng,2);
    if(d<bd){bd=d;best=c;}
  });
  return best;
}
function lumOf(c){
  if(c && c.charAt(0)==="#"){
    const r=parseInt(c.substr(1,2),16), g=parseInt(c.substr(3,2),16), b=parseInt(c.substr(5,2),16);
    return 0.299*r+0.587*g+0.114*b;
  }
  return 128;
}

    const f=d.flight, tm=f.route?f.route:(f.dep+' '+f.time+' '+f.arr);
    seg='<span class="seg flt"><span class="ico">&#9992;</span><span class="tn">'+f.no+
      '</span><span class="tm">'+tm+'</span>'+
      (f.price?'<span class="tm"> · '+f.price+'</span>':'')+
      (f.pending?'<span class="tm pending">（'+f.pending+'）</span>':'')+'</span>';
  }else if(d.train){
    const t=d.train, ico = /大巴|Bus|bus|拼车/.test(t.no||"") ? "&#128652;" : "&#128646;";
    seg='<span class="seg trn"><span class="ico">'+ico+'</span><span class="tn">'+t.no+
      '</span><span class="tm">'+t.dep+' '+t.time+' '+t.arr+'</span></span>';
  }
  const mv = d.move==="in" ? " in" : d.move==="out" ? " out" : "";
  let cityTxt = CITY_CN[d.city]||d.city;
  if(d.move==="round" && d.round_to) cityTxt += ' <span class="rt">&#8644; '+(CITY_CN[d.round_to]||d.round_to)+"</span>";
  return '<div class="row"><span class="dt" style="color:'+dayColor(d.date)+'">'+d.date+
    '<span class="w">周'+d.w+'</span></span>'+
    '<span class="city'+mv+'">'+cityTxt+'</span>'+
    (seg?'<span class="seg">'+seg+"</span>":"")+
    '<span class="sights">'+(d.items||[]).join(" · ")+"</span></div>";
}).join("");

// ---------- 酒店候选卡片列表 ----------
if(window.HOTELS){
  document.getElementById("hotelsSec").style.display="";
  function kindCn(k){return k==="hotel"?"酒店":(k==="guest_house"?"民宿":(k==="hostel"?"青旅":"住宿"));}
  function card(h,rec){
    const stars=h.stars?new Array(h.stars+1).join("★"):"";
    const site=h.website?'<a href="'+h.website+'" target="_blank" rel="noopener">官网</a>':"";
    const bk='<a href="https://www.booking.com/search.html?ss='+encodeURIComponent(h.name+" "+rec.city)+'" target="_blank" rel="noopener">Booking 看价 →</a>';
    const osm='<a href="https://www.openstreetmap.org/?mlat='+h.lat+'&mlon='+h.lon+'#map=18/'+h.lat+'/'+h.lon+'" target="_blank" rel="noopener">OSM 定位</a>';
    return '<div class="hcard"><div class="hn">'+h.name+'<span class="hstars">'+stars+"</span></div>"
      +'<div class="hm">'+kindCn(h.kind)+(h.price?" · "+h.price+"/晚":"")+(h.note?" · "+h.note:"")+"</div>"
      +'<div class="ha">'+site+bk+osm+"</div></div>";
  }
  document.getElementById("hotels").innerHTML = Object.keys(window.HOTELS).map(function(key){
    const rec=window.HOTELS[key], cands=rec.candidates||[];
    const picks=cands.filter(function(h){return (rec.picks||[]).indexOf(h.name)>=0;});
    const rest=cands.filter(function(h){return (rec.picks||[]).indexOf(h.name)<0;});
    return '<div class="hsec"><h3>'+rec.city+(rec.total?"　共 "+rec.total+" 家候选":"")+"</h3>"
      +picks.map(function(h){return card(h,rec);}).join("")
      +(rest.length?'<button class="more" data-k="'+key+'">展开另外 '+rest.length+' 家 ▾</button>'
        +'<div class="morelist" id="ml-'+key+'">'+rest.map(function(h){
          return h.name+(h.stars?" ★"+h.stars:"")+(h.price?" · "+h.price:"");}).join("<br>")
        +"</div>":"")
      +"</div>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".more"),function(b){
    b.onclick=function(){document.getElementById("ml-"+b.getAttribute("data-k")).classList.toggle("on");};
  });
}

// ---------- 版本号（可选） ----------
const V=window.VERSION||{};
document.getElementById("ver").innerHTML = V.version ? "版本 <b>"+V.version+"</b>"+(V.built_at?" · 更新于 "+V.built_at:"")+(V.note?" · "+V.note:"") : "";
document.getElementById("verfoot").textContent = V.version ? (V.version+" · "+(V.built_at||"")+(V.note?" · "+V.note:"")) : "";
</script>
